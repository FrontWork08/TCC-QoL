<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VitaIA - vai dar certo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== telas ===== */
        .tela {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== login ===== */
        .cardLogin {
            background: white;
            max-width: 400px;
            width: 100%;
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: #f0f0f0;
            padding: 4px;
            border-radius: 60px;
            margin-bottom: 24px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .tab.ativo { background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        .campo { margin-bottom: 16px; }
        .campo label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .campo input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: max(16px, 14px);
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }
        .campo input:focus { outline: none; border-color: #667eea; }

        .erro { font-size: 11px; color: #e74c3c; margin-top: 4px; display: none; }
        .erro.visivel { display: block; }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            flex-shrink: 0;
        }
        .btn:hover  { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== app ===== */
        .appContainer {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #telaApp { padding: 0; align-items: stretch; }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .saudacao  { font-size: 13px; color: #888; }
        .nomeUsuario { font-size: 20px; font-weight: 700; color: #333; }

        .avatar {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; flex-shrink: 0;
            user-select: none; transition: transform 0.15s;
        }
        .avatar:hover { transform: scale(1.05); }

        .conteudo {
            flex: 1;
            padding: 16px;
            padding-bottom: 90px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .cardGrande {
            background: #f9f9ff;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid #eee;
            overflow: hidden;
            word-break: break-word;
        }

        /* ===== menu inferior ===== */
        .menuBaixo {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            max-width: 500px; width: 100%;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 8px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            border-top: 1px solid #eee;
            z-index: 200;
        }
        .menuItem {
            display: flex; flex-direction: column;
            align-items: center; gap: 3px;
            font-size: 11px; color: #aaa;
            cursor: pointer; padding: 6px 10px;
            border-radius: 20px;
            transition: color 0.2s, background 0.2s;
            user-select: none; white-space: nowrap;
            min-width: 52px; text-align: center;
        }
        .menuItem span { display: block; line-height: 1; }
        .menuItem.ativo { color: #667eea; background: #f0f0ff; }

        /* ===== modal ===== */
        .modal {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
        }
        .modal.visivel { display: flex; }
        .modalConteudo {
            background: white;
            width: 100%; max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            max-height: 88vh; max-height: 88dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            animation: slideUp 0.28s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }
        @keyframes toastIn {
            from { opacity:0; transform:translateX(-50%) translateY(10px); }
            to   { opacity:1; transform:translateX(-50%) translateY(0); }
        }

        .btnFechar {
            background: none; border: none;
            font-size: 28px; cursor: pointer;
            line-height: 1; color: #888; padding: 4px;
            transition: color 0.2s;
        }
        .btnFechar:hover { color: #333; }

        /* ===== chat ===== */
        .chatArea {
            height: 260px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 12px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .chatInputArea { display: flex; gap: 8px; align-items: flex-end; }
        .chatInputArea textarea {
            flex: 1; padding: 10px 12px;
            border-radius: 12px; border: 1px solid #ddd;
            resize: none; font-family: 'Inter', sans-serif;
            font-size: 14px; line-height: 1.4;
            min-height: 44px; max-height: 100px;
            transition: border-color 0.2s;
        }
        .chatInputArea textarea:focus { outline: none; border-color: #667eea; }
        .btnEnviar { width: auto; padding: 0 18px; height: 44px; flex-shrink: 0; }

        .bolha {
            max-width: 82%; padding: 10px 14px;
            border-radius: 18px; font-size: 14px;
            line-height: 1.45; word-break: break-word;
        }
        .bolha.user {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bolha.ai {
            background: #f0f0f0; color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* ===== responsivo ===== */
        @media (max-width: 390px) {
            .cardLogin { padding: 24px 18px; }
            .menuItem  { padding: 6px 6px; min-width: 44px; font-size: 10px; }
            .conteudo  { padding: 12px; padding-bottom: 88px; }
        }
        @media (min-width: 500px) {
            .modal { align-items: center; }
            .modalConteudo { border-radius: 24px; max-height: 80vh; }
        }
        @media (min-width: 768px) {
            .appContainer {
                border-radius: 24px;
                margin: 20px auto;
                min-height: calc(100vh - 40px);
                min-height: calc(100svh - 40px);
                overflow: hidden;
                box-shadow: 0 24px 60px rgba(0,0,0,0.25);
            }
            #telaApp { align-items: center; }
            .menuBaixo { border-radius: 0 0 24px 24px; }
        }
    </style>
</head>
<body>

<!-- ===== tela de login ===== -->
<div id="telaLogin" class="tela">
    <div class="cardLogin">
        <h1 style="text-align:center;margin-bottom:8px;">🌿 VitaIA</h1>
        <p style="text-align:center;color:#666;margin-bottom:24px;">seu parceiro de saúde</p>

        <div class="tabs">
            <button id="btnTabLogin" class="tab ativo" onclick="mostrarTab('login')">Entrar</button>
            <button id="btnTabCad"   class="tab"       onclick="mostrarTab('cadastro')">Criar conta</button>
        </div>

        <div id="formLogin">
            <div class="campo">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com">
                <div class="erro" id="erroLoginEmail"></div>
            </div>
            <div class="campo">
                <label>Senha</label>
                <input type="password" id="loginSenha" placeholder="******">
                <div class="erro" id="erroLoginSenha"></div>
            </div>
            <button class="btn" onclick="fazerLogin()">Entrar →</button>
            <div id="usuariosSalvos" style="margin-top:16px;font-size:12px;"></div>
        </div>

        <div id="formCadastro" style="display:none">
            <div class="campo">
                <label>Seu nome</label>
                <input type="text" id="cadNome" placeholder="Como te chamo?">
                <div class="erro" id="erroCadNome"></div>
            </div>
            <div class="campo">
                <label>E-mail</label>
                <input type="email" id="cadEmail" placeholder="seu@email.com">
                <div class="erro" id="erroCadEmail"></div>
            </div>
            <div class="campo">
                <label>Senha</label>
                <input type="password" id="cadSenha" placeholder="******">
                <div class="erro" id="erroCadSenha"></div>
            </div>
            <div class="campo">
                <label>Confirmar senha</label>
                <input type="password" id="cadSenha2" placeholder="******">
                <div class="erro" id="erroCadSenha2"></div>
            </div>
            <button class="btn" onclick="fazerCadastro()">Criar conta 🎉</button>
        </div>
    </div>
</div>

<!-- ===== app principal ===== -->
<div id="telaApp" class="tela" style="display:none">
    <div class="appContainer">
        <div class="topo">
            <div>
                <div class="saudacao"   id="saudacaoMsg">Bom dia,</div>
                <div class="nomeUsuario" id="nomeUser">Usuário</div>
            </div>
            <div class="avatar" onclick="sair()" title="sair">👤</div>
        </div>

        <div id="conteudo" class="conteudo"></div>

        <nav class="menuBaixo" role="navigation" aria-label="Menu principal">
            <div class="menuItem ativo" data-pagina="home"      onclick="mudarPagina('home',this)">🏠<span>Home</span></div>
            <div class="menuItem"       data-pagina="progresso" onclick="mudarPagina('progresso',this)">📈<span>Progresso</span></div>
            <div class="menuItem"       data-pagina="plano"     onclick="mudarPagina('plano',this)">🎯<span>Plano</span></div>
            <div class="menuItem"       data-pagina="labs"      onclick="mudarPagina('labs',this)">🧪<span>Labs</span></div>
            <div class="menuItem"       data-pagina="tele"      onclick="mudarPagina('tele',this)">🩺<span>Tele</span></div>
        </nav>
    </div>
</div>

<!-- ===== modal chat ===== -->
<div id="modalChat" class="modal" onclick="if(event.target===this)fechaModal('modalChat')">
    <div class="modalConteudo">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3>💬 Ajuda Imediata</h3>
            <button onclick="fechaModal('modalChat')" class="btnFechar" aria-label="Fechar">×</button>
        </div>
        <div id="chatArea" class="chatArea"></div>
        <div class="chatInputArea">
            <textarea id="chatInput" placeholder="Digite aqui..." rows="2"></textarea>
            <button onclick="enviarChat()" class="btn btnEnviar">Enviar</button>
        </div>
    </div>
</div>

<script>
// ============================================
// VitaIA — script unificado (corrigido)
// ============================================

let usuarioAtual   = null;
let dadosUsuario   = null;
let historicoChat  = [];
let ultimoHumor    = 3;
let aguaHoje       = 0;
let proteinaHoje   = 0;
let carboHoje      = 0;
let gorduraHoje    = 0;
let comidaLog      = [];
let exerciciosHoje = [];
let consultasAgendadas = [];
let paginaAtual    = 'home';

const CHAVE_API = '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';

// ===== helpers =====
function mostrarToast(msg, cor) {
    document.querySelectorAll('.vita-toast').forEach(t => t.remove());
    let toast = document.createElement('div');
    toast.className = 'vita-toast';
    toast.textContent = msg;
    toast.style.cssText = `position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:${cor||'#333'};color:white;padding:12px 24px;border-radius:30px;text-align:center;z-index:9999;font-size:14px;font-family:'Inter',sans-serif;max-width:90vw;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.2);animation:toastIn 0.2s ease;`;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity='0'; toast.style.transition='opacity 0.3s'; setTimeout(()=>toast.remove(),300); }, 2700);
}

function pegarUsuarios() {
    try { let t=localStorage.getItem('vitaia_users'); return t?JSON.parse(t):[]; } catch { return []; }
}
function salvarUsuarios(lista) {
    try { localStorage.setItem('vitaia_users', JSON.stringify(lista)); } catch {}
}
function salvarDadosUsuario() {
    if (!usuarioAtual) return;
    let todos = pegarUsuarios();
    let idx = todos.findIndex(u => u.email === usuarioAtual.email);
    if (idx !== -1) { todos[idx].dados = dadosUsuario; salvarUsuarios(todos); }
}

// ===== login / cadastro =====
function limparErros() {
    document.querySelectorAll('.erro').forEach(el => { el.textContent=''; el.classList.remove('visivel'); });
}
function mostrarErro(id, msg) {
    let el = document.getElementById(id);
    if (el) { el.innerText=msg; el.classList.add('visivel'); }
}

function mostrarTab(tab) {
    limparErros();
    if (tab === 'login') {
        document.getElementById('formLogin').style.display    = 'block';
        document.getElementById('formCadastro').style.display = 'none';
        document.getElementById('btnTabLogin').classList.add('ativo');
        document.getElementById('btnTabCad').classList.remove('ativo');
        renderizarUsuariosSalvos();
    } else {
        document.getElementById('formLogin').style.display    = 'none';
        document.getElementById('formCadastro').style.display = 'block';
        document.getElementById('btnTabCad').classList.add('ativo');
        document.getElementById('btnTabLogin').classList.remove('ativo');
    }
}

function renderizarUsuariosSalvos() {
    let users = pegarUsuarios();
    let div = document.getElementById('usuariosSalvos');
    if (!div) return;
    if (!users.length) { div.innerHTML=''; return; }
    div.innerHTML = '<div style="margin-bottom:6px;font-size:11px;color:#aaa;">⚡ rápido:</div>' +
        users.map(u=>`<span style="display:inline-block;background:#f0f0f0;padding:4px 12px;border-radius:20px;margin:2px;font-size:11px;cursor:pointer" onclick="preencherLogin('${u.email}')">${u.nome||u.email.split('@')[0]}</span>`).join('');
}

function preencherLogin(email) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginSenha').focus();
}

function fazerLogin() {
    limparErros();
    let email = document.getElementById('loginEmail').value.trim();
    let senha = document.getElementById('loginSenha').value;
    let users = pegarUsuarios();
    let user  = users.find(u => u.email === email);
    if (!user)              { mostrarErro('erroLoginEmail','E-mail não encontrado'); return; }
    if (user.senha !== senha){ mostrarErro('erroLoginSenha','Senha errada'); return; }

    usuarioAtual = { email: user.email, nome: user.nome };
    dadosUsuario = user.dados || { metaAgua:2, createdAt:new Date().toISOString(), ultimoReset:new Date().toDateString() };

    let hoje = new Date().toDateString();
    if (dadosUsuario.ultimoReset !== hoje) {
        aguaHoje=proteinaHoje=carboHoje=gorduraHoje=0;
        comidaLog=[]; exerciciosHoje=[];
        dadosUsuario.ultimoReset=hoje; salvarDadosUsuario();
    } else {
        aguaHoje      = dadosUsuario.agua      || 0;
        proteinaHoje  = dadosUsuario.proteina  || 0;
        carboHoje     = dadosUsuario.carbo     || 0;
        gorduraHoje   = dadosUsuario.gordura   || 0;
        comidaLog     = dadosUsuario.comidas   || [];
        exerciciosHoje= dadosUsuario.exercicios|| [];
    }

    document.getElementById('nomeUser').innerText = user.nome;
    let hora = new Date().getHours();
    document.getElementById('saudacaoMsg').innerText = hora<12?'Bom dia,':hora<18?'Boa tarde,':'Boa noite,';
    document.getElementById('telaLogin').style.display = 'none';
    document.getElementById('telaApp').style.display   = 'flex';
    mudarPagina('home');
    mostrarToast(`Bem vindo de volta, ${user.nome}! 🌿`);
}

function fazerCadastro() {
    limparErros();
    let nome   = document.getElementById('cadNome').value.trim();
    let email  = document.getElementById('cadEmail').value.trim();
    let senha  = document.getElementById('cadSenha').value;
    let senha2 = document.getElementById('cadSenha2').value;
    let ok = true;
    if (!nome)               { mostrarErro('erroCadNome',   'Coloca seu nome aí'); ok=false; }
    if (!email.includes('@')){ mostrarErro('erroCadEmail',  'Email inválido');      ok=false; }
    if (senha.length < 4)    { mostrarErro('erroCadSenha',  'Senha muito curta');   ok=false; }
    if (senha !== senha2)    { mostrarErro('erroCadSenha2', 'Senhas diferentes');   ok=false; }
    if (!ok) return;

    let users = pegarUsuarios();
    if (users.find(u=>u.email===email)) { mostrarErro('erroCadEmail','Email já cadastrado'); return; }
    users.push({ nome, email, senha, dados:{ metaAgua:2, createdAt:new Date().toISOString(), ultimoReset:new Date().toDateString() } });
    salvarUsuarios(users);
    mostrarToast('Conta criada! Faça o login','#00b87a');
    mostrarTab('login');
    preencherLogin(email);
}

function sair() {
    if (confirm('Sair da conta?')) {
        usuarioAtual=dadosUsuario=null;
        document.getElementById('telaApp').style.display   = 'none';
        document.getElementById('telaLogin').style.display = 'flex';
        mostrarTab('login');
    }
}

// ===== navegação =====
async function mudarPagina(pagina, el) {
    paginaAtual = pagina;
    document.querySelectorAll('.menuItem').forEach(i=>i.classList.remove('ativo'));
    (el || document.querySelector(`.menuItem[data-pagina="${pagina}"]`))?.classList.add('ativo');
    let conteudo = document.getElementById('conteudo');
    conteudo.scrollTop = 0;

    if (pagina === 'home') {
        conteudo.innerHTML = gerarHome();
        document.querySelectorAll('.moodBtn').forEach(btn=>
            btn.addEventListener('click',()=>registrarHumor(parseInt(btn.dataset.mood))));
        document.querySelectorAll('.aguaBtn').forEach(btn=>
            btn.addEventListener('click',()=>adicionarAgua(parseFloat(btn.dataset.litros))));
        await carregarInsight();
    } else if (pagina === 'progresso') {
        conteudo.innerHTML = gerarProgresso();
    } else if (pagina === 'plano') {
        conteudo.innerHTML = gerarPlano();
        document.getElementById('btnGerarPlano').addEventListener('click', gerarPlanoIA);
    } else if (pagina === 'labs') {
        conteudo.innerHTML = gerarLabs();
    } else if (pagina === 'tele') {
        conteudo.innerHTML = gerarTele();
    }
}

// ===== geradores de HTML =====
function gerarHome() {
    let metaAgua    = dadosUsuario?.metaAgua || 2;
    let pctAgua     = Math.min((aguaHoje/metaAgua)*100, 100);
    let pctProteina = Math.min((proteinaHoje/120)*100, 100);
    return `
        <div class="cardGrande" style="background:linear-gradient(135deg,#667eea,#764ba2);color:white">
            <div style="font-size:13px;opacity:0.8;margin-bottom:12px">Como você está hoje?</div>
            <div style="display:flex;justify-content:space-around">
                ${[['1','😢','Mal'],['2','😟','Instável'],['3','😐','Neutro'],['4','🙂','Bem'],['5','😄','Ótimo']].map(([m,e,l])=>`
                <button class="moodBtn" data-mood="${m}" style="background:none;border:none;color:white;text-align:center;cursor:pointer;padding:8px 4px;border-radius:12px;font-family:'Inter',sans-serif">
                    <div style="font-size:26px">${e}</div><small style="font-size:10px">${l}</small>
                </button>`).join('')}
            </div>
        </div>
        <div class="cardGrande">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                <span>💧 Água hoje</span>
                <span style="font-weight:600">${aguaHoje.toFixed(1)}L / ${metaAgua}L</span>
            </div>
            <div style="height:8px;background:#eee;border-radius:4px;margin-bottom:12px">
                <div style="height:100%;width:${pctAgua}%;background:#00b87a;border-radius:4px;transition:width 0.4s"></div>
            </div>
            <div style="display:flex;gap:8px">
                <button class="aguaBtn" data-litros="0.2" style="flex:1;padding:10px 0;background:#e0f2fe;border:none;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600">+200ml</button>
                <button class="aguaBtn" data-litros="0.5" style="flex:1;padding:10px 0;background:#e0f2fe;border:none;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600">+500ml</button>
                <button class="aguaBtn" data-litros="1"   style="flex:1;padding:10px 0;background:#e0f2fe;border:none;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600">+1L</button>
            </div>
        </div>
        <div class="cardGrande">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                <span>🥩 Proteína</span>

// ===== chat =====
function iniciarChat() {
    historicoChat=[];
    let area=document.getElementById('chatArea');
    if (area) area.innerHTML='<div class="bolha ai">Olá! Como posso te ajudar hoje? 😊</div>';
    let input=document.getElementById('chatInput');
    if (input) input.value='';
}

async function enviarChat() {
    let input=document.getElementById('chatInput');
    let msg=input?.value.trim();
    if (!msg) return;
    let area=document.getElementById('chatArea');
    area.innerHTML+=`<div class="bolha user">${msg}</div>`;
    input.value=''; area.scrollTop=area.scrollHeight;
    let typing=document.createElement('div');
    typing.className='bolha ai'; typing.innerHTML='<em>digitando...</em>';
    area.appendChild(typing); area.scrollTop=area.scrollHeight;
    historicoChat.push({role:'user',content:msg});
    try {
        let r=await chamarGroqChat('Você é VitaIA, assistente de saúde empático. Responda de forma acolhedora e curta.',historicoChat);
        typing.remove();
        area.innerHTML+=`<div class="bolha ai">${r}</div>`;
        historicoChat.push({role:'assistant',content:r});
    } catch { typing.innerHTML='Tente novamente em alguns segundos.'; }
    area.scrollTop=area.scrollHeight;
}

document.addEventListener('keydown', e => {
    if (e.target.id==='chatInput' && e.key==='Enter' && !e.shiftKey) { e.preventDefault(); enviarChat(); }
});

// ===== API Groq =====
async function chamarGroq(prompt) {
    let res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${CHAVE_API}`},
        body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt}],max_tokens:300})
    });
    let data=await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.choices[0].message.content;
}
async function chamarGroqChat(sys, history) {
    let res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${CHAVE_API}`},
        body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:sys},...history],max_tokens:400})
    });
    let data=await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.choices[0].message.content;
}

});
