name: Integrar Firebase Auth no frontend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir carregamento do bridge de autenticação
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="firebase-auth-bridge.js"></script>'
          if tag not in text:
              marker = '<script src="app.js"></script>'
              if marker not in text:
                  raise SystemExit('Não encontrei o ponto de carregamento do app.js em index.html')
              text = text.replace(marker, marker + '\n' + tag, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commitar integração
        run: |
          if git diff --quiet -- index.html; then
            echo 'Bridge já integrado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: carregar bridge do Firebase Authentication'
          git push
